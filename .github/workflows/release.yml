name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

# A tag push and a release published in the UI can refer to the same version.
# Serialize them so asset uploads never race, including manual reruns.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish all platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Read version from tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vX.Y.Z, starting with v0.2.0." >&2
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Test with the race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build and package Windows, Linux and macOS (amd64 and arm64)
        run: bash ./release.sh "$RUNNER_TEMP/release"

      - name: Verify release checksums and executable version
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          tar -xzf "pi-manager_${VERSION}_linux_amd64.tar.gz"
          test "$(./pi-manager_"${VERSION}"_linux_amd64/pi-manager --version)" = "Pi-Manager ${VERSION}"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          assets=("$RUNNER_TEMP/release/"*.zip "$RUNNER_TEMP/release/"*.tar.gz "$RUNNER_TEMP/release/SHA256SUMS")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "Pi-Manager ${VERSION}" --generate-notes
          fi
