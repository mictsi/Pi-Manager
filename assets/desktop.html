<!DOCTYPE html>
<html lang="en" data-theme="{{DESKTOP_THEME}}" data-sk-theme="{{DESKTOP_THEME}}" data-sk-density="{{DESKTOP_DENSITY}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Pi-Manager</title>
    <style>{{DESKTOP_STYLES}}</style>
</head>
<body class="sk-app-shell pi-workspace">
    <a class="sk-skip-link" id="skipLink" href="#tabContent">Skip to main content</a>
    <header class="topbar sk-app-shell__header">
        <div class="topbar-row">
            <button class="sk-icon-button navigation-toggle" id="navigationToggle" type="button" aria-expanded="false" aria-controls="workspaceNav" aria-label="Open navigation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="app-identity">
                <svg class="app-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="black"/><path d="M7 11h18M11 11v12M21 11v8c0 3 1 4 3 3" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
                <h1>Pi-Manager <span class="dim">· Dashboard</span></h1>
            </div>
            <div class="pills" id="serverPills" aria-label="Server status"></div>
            <div class="topbar-actions">
                <select class="sk-select language-select" id="languageSelect" aria-label="Language" title="Language">
                    <option value="en">English</option><option value="da">Dansk</option><option value="el">Ελληνικά</option><option value="sv">Svenska</option>
                </select>
                <button class="sk-icon-button density-toggle" id="densityToggle" type="button" aria-pressed="true" aria-label="Dense mode" title="Dense mode">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 4h14M5 10h14M5 14h14M5 20h14M3 7h18M3 17h18"/></svg>
                </button>
                <button class="theme-toggle sk-icon-button" id="themeToggle" type="button" aria-label="Switch light/dark theme" title="Switch light/dark theme">
                    <span class="theme-toggle-knob">
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14a9 9 0 0 1-10-10A9 9 0 1 0 20.5 14Z"/></svg>
                    </span>
                </button>
            </div>
        </div>
    </header>
    <div class="sk-app-shell__body workspace-body">
        <aside class="workspace-nav" id="workspaceNav" aria-label="Primary navigation">
            <div class="navigation-heading"><button type="button" class="sk-icon-button navigation-close" id="navigationClose" aria-label="Close navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
            <nav class="tabs" id="tabs" aria-label="Primary navigation"></nav>
        </aside>
        <div class="workspace-content">
            <div class="workspace-alerts" id="errorArea" aria-live="polite"></div>
            <main class="sk-app-shell__main" id="tabContent" tabindex="-1"></main>
        </div>
    </div>
    <div class="toast-area sk-toast-region" id="toastArea" role="status" aria-live="polite" aria-label="Notifications"></div>
    <script>{{DESKTOP_CHART}}</script>
    <script>{{DESKTOP_APP}}</script>
</body>
</html>
