<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Pi-Manager</title>
    <style>{{DESKTOP_STYLES}}</style>
</head>
<body>
		<header class="topbar">
			<div class="topbar-row">
				<h1>Pi-Manager <span class="dim">· Dashboard</span></h1>
			<div class="topbar-actions">
			<select class="language-select" id="languageSelect" aria-label="Language" title="Language">
				<option value="en">English</option>
				<option value="da">Dansk</option>
				<option value="el">Ελληνικά</option>
				<option value="sv">Svenska</option>
			</select>
			<button class="theme-toggle" id="themeToggle" aria-label="Switch light/dark theme" title="Switch light/dark theme">
					<span class="theme-toggle-knob">
						<svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<circle cx="12" cy="12" r="4.5" fill="currentColor"/>
							<g stroke="currentColor" stroke-width="2" stroke-linecap="round">
								<path d="M12 1.5v2.5M12 20v2.5M22.5 12H20M4 12H1.5M19.07 4.93l-1.77 1.77M6.7 17.3l-1.77 1.77M19.07 19.07l-1.77-1.77M6.7 6.7 4.93 4.93"/>
							</g>
						</svg>
						<svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/>
						</svg>
					</span>
				</button>
			</div>
			</div>
			<div class="pills" id="serverPills"></div>
		</header>
		<nav class="tabs" id="tabs"></nav>
		<main id="tabContent"></main>
		<div class="toast-area" id="toastArea"></div>
    <script>{{DESKTOP_CHART}}</script>
    <script>{{DESKTOP_APP}}</script>
</body>
</html>
